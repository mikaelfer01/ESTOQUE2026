<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem de Estoque</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2d3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque WMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    /* Tema "coletor de dados" claro: cores vivas e alto contraste como um
       leitor industrial (Zebra/Honeywell), só que em fundo claro — o visor
       de quantidade continua com o efeito LED verde escuro como destaque. */
    --shell: #1d2d3e;
    --shell-dark: #16232f;
    --brand: #0a6ed1;
    --brand-dark: #085caf;
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-raised: #eef1f4;
    --ink: #1d2d3e;
    --ink-soft: #6a6d78;
    --line: #d9dde1;
    --ok: #107e3e;
    --ok-bg: #e6f4ea;
    --warning: #df6e0c;
    --warning-bg: #fdf1e2;
    --danger: #bb0000;
    --danger-bg: #fbe9e9;
    font-size: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }

  .shellbar{
    background: linear-gradient(180deg, var(--shell), var(--shell-dark));
    color:#fff; padding:0 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .shellbar-inner{
    max-width:640px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:6px 14px; padding:12px 0;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.98rem; letter-spacing:0.01em; white-space:nowrap; }
  .brand-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:5px; background:var(--brand);
    font-size:0.8rem; font-weight:800;
  }
  .brand-accent{ color:#8fc4ff; font-weight:400; }
  .shell-nav{ display:flex; gap:4px; flex-wrap:wrap; }
  .shell-nav a{
    color:rgba(255,255,255,0.72); text-decoration:none; font-size:0.82rem; font-weight:600;
    padding:6px 10px; border-radius:4px; transition: background 0.12s ease, color 0.12s ease;
  }
  .shell-nav a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .shell-nav a.active{ background:var(--brand); color:#fff; }

  .page-shell{
    display:flex; flex-direction:column; justify-content:center;
    min-height: calc(100vh - 61px); min-height: calc(100dvh - 61px);
  }
  .page-shell.top-align{ justify-content:flex-start; }
  .wrap{ max-width: 640px; width:100%; margin: 0 auto; padding: 14px 12px 24px; }

  .stats-row{ display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom:12px; }
  .stat-card{
    background: var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:11px 14px; box-shadow:0 1px 3px rgba(29,45,62,0.06); border-top:3px solid var(--brand);
  }
  .stat-card .num{ font-size:1.35rem; font-weight:800; color:var(--brand); font-family:'Consolas','Courier New', monospace; }
  .stat-card .lbl{ font-size:0.7rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }

  .hero-icon{
    width:44px; height:44px; border-radius:50%; background:rgba(47,129,247,0.14); color:var(--brand);
    display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 10px;
    border:1px solid var(--brand);
  }

  h1{
    font-size:1.2rem; margin: 0 0 10px; font-weight:700;
    letter-spacing: -0.01em; color:var(--ink);
  }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(29,45,62,0.06);
  }

  .section-label{
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); margin-bottom:10px;
  }

  .session-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border:1px solid var(--line); border-radius:5px;
    background:var(--surface); margin-bottom:8px; border-left:3px solid var(--brand);
  }
  .session-row .lbl{ font-weight:700; font-size:0.92rem; }
  .session-row .status{ font-size:0.75rem; color:var(--warning); font-weight:600; }

  button{
    font-family: inherit; cursor:pointer; border:none;
    border-radius:5px; font-weight:600; font-size:0.9rem;
    padding: 10px 16px; transition: background 0.12s ease, transform 0.05s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--brand); color:#fff; }
  .btn-primary:hover{ background: var(--brand-dark); }
  .btn-secondary{ background:var(--surface-raised); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ background:#e2e6ea; }
  .btn-danger{ background: var(--danger); color:#fff; }
  .btn-danger:hover{ background:#970000; }
  .btn-block{ width:100%; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  .field label{ display:block; font-size:0.78rem; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:5px; font-size:1rem; background:var(--surface); color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--brand); outline-offset:-1px; }
  .field{ margin-bottom:14px; }

  .search-results{ max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:5px; background:var(--surface); }
  .prod-item{ padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
  .prod-item:last-child{ border-bottom:none; }
  .prod-item:hover{ background: var(--surface-raised); }
  .prod-sku{ font-family:'Consolas', 'Courier New', monospace; font-weight:700; font-size:0.82rem; color:var(--ok); white-space:nowrap; }
  .prod-desc{ font-size:0.88rem; color:var(--ink-soft); text-align:right; }

  .selected-product{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--surface-raised); border:1px solid var(--brand); border-radius:5px;
    padding: 12px 14px; margin-bottom:14px;
  }
  .selected-product .name{ font-weight:700; }
  .selected-product .sku{ font-family:'Consolas', 'Courier New', monospace; font-size:0.8rem; color:var(--ink-soft); }
  .clear-sel{ background:none; border:none; color:var(--ink-soft); font-size:1.2rem; padding:0 4px; }

  /* Leitor tipo LCD/terminal para a quantidade — a peça central do
     "coletor de dados": dígitos grandes, verdes, em monoespaçada. */
  .qty-readout{
    background:var(--ok-bg); border:1px solid var(--ok); border-radius:6px;
    padding:14px 16px; margin-bottom:0; display:flex; align-items:center; justify-content:space-between;
  }
  .qty-readout input{
    font-family:'Consolas','Courier New', monospace; font-size:2.1rem; font-weight:700;
    color:var(--ok); background:transparent; border:none; width:100%; padding:0;
    letter-spacing:0.02em;
  }
  .qty-readout input:focus{ outline:none; }
  .qty-readout .unit{ color:var(--ok); opacity:0.75; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; }

  .scan-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: var(--surface-raised); color:var(--brand); border:1px solid var(--brand);
    flex-shrink:0; width:46px; font-size:1.2rem; padding:0;
  }
  .scan-row{ display:flex; gap:8px; }
  .scan-row input{ flex:1; min-width:0; }

  .scanner-modal .modal{ max-width:480px; padding:0; overflow:hidden; background:#000; }
  .scanner-video-wrap{ position:relative; width:100%; aspect-ratio: 3/4; background:#000; }
  .scanner-video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .scanner-reticle{
    position:absolute; left:10%; right:10%; top:38%; bottom:38%;
    border:2px solid var(--ok); border-radius:6px; box-shadow:0 0 0 999px rgba(0,0,0,0.35);
  }
  .scanner-hint{
    position:absolute; left:0; right:0; bottom:12px; text-align:center;
    color:#fff; font-size:0.8rem; text-shadow:0 1px 3px rgba(0,0,0,0.8);
  }
  .scanner-footer{ padding:14px 16px; background:var(--surface); }
  .scanner-error{ padding:20px 16px; color:#fff; font-size:0.9rem; }

  .header-bar{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px;
    margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .header-bar .sess-label{ font-weight:700; font-size:1rem; word-break:break-word; }
  .header-bar .sess-sub{ font-size:0.75rem; color:var(--ok); font-weight:600; }
  .header-bar #finish-btn{ flex-shrink:0; }

  .log{ margin-top:14px; }
  .log h3{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }
  .log-item{
    display:flex; justify-content:space-between; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:0.9rem;
  }
  .log-qty{ font-weight:700; color:var(--ok); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--shell); color:#fff; border:none;
    padding:12px 20px; border-radius:5px;
    font-size:0.9rem; opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease;
    max-width:90vw; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .toast.error{ background: var(--danger); }

  .empty{ text-align:center; color:var(--ink-soft); padding:24px 10px; font-size:0.9rem; }
  .spinner{
    width:18px; height:18px; border:2px solid rgba(255,255,255,0.35);
    border-top-color:#fff; border-radius:50%; display:inline-block;
    animation: spin 0.7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,25,35,0.55);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{ background:var(--surface); border-radius:8px; padding:22px; max-width:380px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.25); }
  .modal h3{ margin-top:0; color:var(--ink); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions button{ flex:1; }

  @media (max-width: 420px){
    .header-bar{ flex-direction:column; align-items:stretch; }
    .header-bar #finish-btn{ width:100%; }
    .prod-item{ flex-direction:column; align-items:flex-start; gap:2px; }
    .prod-desc{ text-align:left; }
  }
</style>
</head>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script>
let state = {
  view: 'loading', // loading | sessions | counting
  openSessions: [],
  products: [],
  session: null, // {id, column, label}
  search: '',
  selectedProduct: null,
  qty: '',
  sessionLog: [], // {sku, desc, qty, time}
  busy: false,
  confirmFinish: false
};

function render(){
  const c = document.getElementById('content');
  const shell = document.getElementById('pageShell');
  shell.classList.toggle('top-align', state.view === 'counting');

  if(state.view === 'loading'){
    c.innerHTML = `<div class="empty"><span class="spinner" style="border-color:rgba(0,0,0,0.12); border-top-color:var(--brand);"></span><br><br>Carregando...</div>`;
    return;
  }
  if(state.view === 'sessions'){
    c.innerHTML = renderSessions();
    attachSessionEvents();
    return;
  }
  if(state.view === 'counting'){
    c.innerHTML = renderCounting();
    attachCountingEvents();
    return;
  }
}

function renderSessions(){
  let sessionsHtml = '';
  if(state.openSessions.length === 0){
    sessionsHtml = `
      <div class="empty">
        <div class="hero-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="1.5"></rect><rect x="9" y="2.5" width="6" height="3" rx="1"></rect><line x1="8.5" y1="10" x2="15.5" y2="10"></line><line x1="8.5" y1="13.5" x2="15.5" y2="13.5"></line><line x1="8.5" y1="17" x2="12.5" y2="17"></line></svg></div>
        Nenhuma contagem aberta.
      </div>`;
  } else {
    sessionsHtml = state.openSessions.map(s => `
      <div class="session-row">
        <div>
          <div class="lbl">${escapeHtml(s.label)}</div>
          <div class="status">● aberta</div>
        </div>
        <button class="btn-secondary" data-join="${escapeHtml(s.id)}" data-label="${escapeHtml(s.label)}">Entrar</button>
      </div>
    `).join('');
  }
  return `
    <div class="stats-row">
      <div class="stat-card">
        <div class="num">${state.products.length.toLocaleString('pt-BR')}</div>
        <div class="lbl">Produtos cadastrados</div>
      </div>
      <div class="stat-card">
        <div class="num">${state.openSessions.length}</div>
        <div class="lbl">Contagens em aberto</div>
      </div>
    </div>
    <h1>Iniciar contagem</h1>
    <div class="panel">
      <div class="section-label">Contagens em aberto</div>
      ${sessionsHtml}
    </div>
    <button class="btn-primary btn-block" id="new-session" ${state.busy ? 'disabled' : ''}>
      ${state.busy ? '<span class="spinner"></span>' : '+ Iniciar nova contagem'}
    </button>
  `;
}

function renderCounting(){
  let selBlock = '';
  if(state.selectedProduct){
    selBlock = `
      <div class="selected-product">
        <div>
          <div class="name">${escapeHtml(state.selectedProduct.descricao)}</div>
          <div class="sku">${escapeHtml(state.selectedProduct.sku)}</div>
        </div>
        <button class="clear-sel" id="clear-sel">✕</button>
      </div>
      <div class="field">
        <label>Quantidade (kg)</label>
        <div class="qty-readout">
          <input type="number" inputmode="decimal" step="any" min="0" id="qty-input" placeholder="0.0" value="${state.qty}">
          <div class="unit">kg</div>
        </div>
      </div>
      <button class="btn-primary btn-block" id="lancar-btn" ${state.busy ? 'disabled' : ''}>
        ${state.busy ? '<span class="spinner"></span>' : 'Lançar quantidade'}
      </button>
    `;
  } else {
    selBlock = `
      <div class="field">
        <label>Produto</label>
        <div class="scan-row">
          <input type="text" id="search-input" placeholder="Ex: 4521 ou filé de peito" value="${escapeHtml(state.search)}" autocomplete="off">
          <button type="button" class="scan-btn" id="scan-btn" title="Escanear código de barras"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"></path><circle cx="12" cy="12" r="3.2"></circle></svg></button>
        </div>
      </div>
      <div class="search-results" id="search-results-box"></div>
    `;
  }

  let logBlock = '';
  if(state.sessionLog.length > 0){
    logBlock = `
      <div class="log">
        <h3>Lançamentos</h3>
        ${state.sessionLog.slice().reverse().map(l => `
          <div class="log-item">
            <span>${escapeHtml(l.desc)} <span style="color:var(--ink-soft); font-family:'Courier New',monospace;">(${escapeHtml(l.sku)})</span></span>
            <span class="log-qty">+${l.qty} kg</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  const modal = state.confirmFinish ? `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>Finalizar contagem?</h3>
        <p style="color:var(--ink-soft); font-size:0.9rem;">Ninguém mais poderá lançar nesta sessão.</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancel-finish">Cancelar</button>
          <button class="btn-danger" id="confirm-finish-btn">Finalizar</button>
        </div>
      </div>
    </div>
  ` : '';

  return `
    <div class="header-bar">
      <div>
        <div class="sess-label">${escapeHtml(state.session.label)}</div>
        <div class="sess-sub">● aberta</div>
      </div>
      <button class="btn-danger" id="finish-btn">Finalizar contagem</button>
    </div>
    <div class="panel">
      ${selBlock}
    </div>
    ${logBlock}
    ${modal}
  `;
}

// ---- Busca dinâmica de produtos ----
// Remove acentos, ignora maiúsc/minúsc e caracteres de pontuação/separadores,
// pra digitação como "file frango", "filé-frango" ou "FILE DE FRANGO" acharem o mesmo produto.
function normalizeStr(s){
  return String(s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function searchProducts(query, products){
  const qNorm = normalizeStr(query);
  if(!qNorm) return [];
  const tokens = qNorm.split(' ').filter(Boolean);

  const scored = [];
  for(const p of products){
    const skuNorm = normalizeStr(p.sku);
    const descNorm = normalizeStr(p.descricao);
    const haystack = skuNorm + ' ' + descNorm;

    // cada palavra digitada precisa aparecer em algum lugar (SKU ou descrição),
    // em qualquer ordem — permite digitar as palavras do produto fora de ordem.
    let allTokensMatch = true;
    let score = 0;
    for(const t of tokens){
      const idx = haystack.indexOf(t);
      if(idx === -1){ allTokensMatch = false; break; }
      score += idx; // match mais cedo no texto = mais relevante
    }
    if(!allTokensMatch) continue;

    // bônus de relevância: match exato ou no início ganham prioridade
    if(skuNorm === qNorm || descNorm === qNorm) score -= 10000;
    else if(skuNorm.startsWith(qNorm) || descNorm.startsWith(qNorm)) score -= 5000;

    scored.push({ p, score });
  }

  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 40).map(s => s.p);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Atualiza só a lista de resultados da busca, sem tocar no <input> —
// ver comentário em attachCountingEvents.
function renderSearchResults(){
  const box = document.getElementById('search-results-box');
  if(!box) return;
  const term = state.search.trim();
  if(term === ''){ box.innerHTML = ''; return; }
  const filtered = searchProducts(term, state.products);
  box.innerHTML = filtered.length === 0
    ? `<div class="empty">Nenhum produto encontrado.</div>`
    : filtered.map(p => `
        <div class="prod-item" data-sku="${escapeHtml(p.sku)}">
          <span class="prod-sku">${escapeHtml(p.sku)}</span>
          <span class="prod-desc">${escapeHtml(p.descricao)}</span>
        </div>
      `).join('');
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
  if(isError) beepError(); else beepOk();
}

// ---- Bipe de coletor de dados (gerado via Web Audio, sem arquivo de áudio) ----
function getAudioCtx(){
  if(!getAudioCtx._ctx) getAudioCtx._ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(getAudioCtx._ctx.state === 'suspended') getAudioCtx._ctx.resume();
  return getAudioCtx._ctx;
}
function beep(freq, durationMs, volume){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain).connect(ctx.destination);
    const now = ctx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);
    osc.stop(now + durationMs / 1000 + 0.02);
  } catch(err){ /* áudio bloqueado/indisponível — segue sem som */ }
}
function beepScan(){ beep(2200, 90, 0.25); }
function beepOk(){ beep(1400, 90, 0.2); }
function beepError(){ beep(220, 260, 0.25); }

// ---- API calls ----
async function getProducts(){
  const res = await fetch('/api/products');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function getOpenSessions(){
  const res = await fetch('/api/sessions');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function startSession(){
  const res = await fetch('/api/sessions', { method: 'POST' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function addCount(sessionId, sku, qtd){
  const res = await fetch('/api/counts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, sku, qtd })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function finishSession(sessionId){
  const res = await fetch(`/api/sessions/${sessionId}/finish`, { method: 'POST' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ---- Gera e baixa a planilha (CSV) da contagem finalizada ----
function downloadCsv(filename, headers, rows){
  const escapeCsv = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const lines = [headers.map(escapeCsv).join(';')];
  rows.forEach(r => lines.push(r.map(escapeCsv).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function baixarPlanilhaSessao(sessionId, label){
  const res = await fetch(`/api/results?sessionId=${encodeURIComponent(sessionId)}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const rows = data.results.map(r => [r.sku, r.descricao, Number(r.quantidade)]);
  const nomeArquivo = 'contagem-' + label.replace(/[^0-9a-zA-Z]+/g, '-') + '.csv';
  downloadCsv(nomeArquivo, ['SKU', 'Descricao', 'Quantidade_kg'], rows);
}

async function loadSessionsScreen(){
  state.view = 'loading'; render();
  try{
    const [prodRes, sessRes] = await Promise.all([getProducts(), getOpenSessions()]);
    state.products = prodRes.products;
    state.openSessions = sessRes.sessions;
    state.view = 'sessions';
  } catch(err){
    showToast('Erro ao carregar: ' + err.message, true);
    state.view = 'sessions';
    state.openSessions = [];
  }
  render();
}

function attachSessionEvents(){
  document.getElementById('new-session').addEventListener('click', async () => {
    state.busy = true; render();
    try{
      const r = await startSession();
      state.session = { id: r.sessionId, label: r.label };
      state.sessionLog = [];
      state.selectedProduct = null;
      state.search = '';
      state.view = 'counting';
      showToast('Contagem iniciada: ' + r.label);
    } catch(err){
      showToast('Erro ao iniciar contagem: ' + err.message, true);
    }
    state.busy = false;
    render();
  });

  document.querySelectorAll('[data-join]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.session = { id: btn.dataset.join, label: btn.dataset.label };
      state.sessionLog = [];
      state.selectedProduct = null;
      state.search = '';
      state.view = 'counting';
      showToast('Você entrou na contagem: ' + btn.dataset.label);
      render();
    });
  });
}

function attachCountingEvents(){
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    // A lista de resultados é atualizada à parte (renderSearchResults),
    // sem recriar o <input> — recriar o campo a cada tecla fazia o teclado
    // numérico/predição do Android reiniciar (voltando pra letras).
    renderSearchResults();
    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      renderSearchResults();
    });
  }

  const resultsBox = document.getElementById('search-results-box');
  if(resultsBox){
    resultsBox.addEventListener('click', (e) => {
      const item = e.target.closest('.prod-item');
      if(!item) return;
      const sku = item.dataset.sku;
      state.selectedProduct = state.products.find(p => p.sku === sku);
      state.qty = '';
      render();
      setTimeout(() => { const q = document.getElementById('qty-input'); if(q) q.focus(); }, 0);
    });
  }

  const clearSel = document.getElementById('clear-sel');
  if(clearSel){
    clearSel.addEventListener('click', () => {
      state.selectedProduct = null;
      render();
      setTimeout(() => { const s = document.getElementById('search-input'); if(s) s.focus(); }, 0);
    });
  }

  const scanBtn = document.getElementById('scan-btn');
  if(scanBtn) scanBtn.addEventListener('click', openScanner);

  const qtyInput = document.getElementById('qty-input');
  if(qtyInput){
    qtyInput.addEventListener('input', (e) => { state.qty = e.target.value; });
    qtyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLancar(); });
  }

  const lancarBtn = document.getElementById('lancar-btn');
  if(lancarBtn) lancarBtn.addEventListener('click', doLancar);

  const finishBtn = document.getElementById('finish-btn');
  if(finishBtn) finishBtn.addEventListener('click', () => { state.confirmFinish = true; render(); });

  const cancelFinish = document.getElementById('cancel-finish');
  if(cancelFinish) cancelFinish.addEventListener('click', () => { state.confirmFinish = false; render(); });

  const confirmFinishBtn = document.getElementById('confirm-finish-btn');
  if(confirmFinishBtn) confirmFinishBtn.addEventListener('click', async () => {
    state.busy = true;
    try{
      await finishSession(state.session.id);
      try{
        await baixarPlanilhaSessao(state.session.id, state.session.label);
        showToast('Contagem finalizada. Planilha baixada.');
      } catch(csvErr){
        showToast('Contagem finalizada, mas não deu pra gerar a planilha: ' + csvErr.message, true);
      }
      state.confirmFinish = false;
      state.session = null;
      await loadSessionsScreen();
      return;
    } catch(err){
      showToast('Erro ao finalizar: ' + err.message, true);
    }
    state.busy = false;
    state.confirmFinish = false;
    render();
  });
}

// ---- Leitor de código de barras pela câmera ----
async function openScanner(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop scanner-modal';
  backdrop.innerHTML = `
    <div class="modal">
      <div id="scanner-body"></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const body = backdrop.querySelector('#scanner-body');

  let stopped = false;
  function close(stream){
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    backdrop.remove();
  }
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) close(); });

  if(!('BarcodeDetector' in window)){
    body.innerHTML = `
      <div class="scanner-error">
        <strong>Leitor de código de barras não é suportado neste navegador.</strong><br><br>
        Use a busca por texto normalmente (SKU ou descrição).
      </div>
      <div class="scanner-footer"><button class="btn-secondary btn-block" id="scanner-close">Fechar</button></div>
    `;
    body.querySelector('#scanner-close').addEventListener('click', () => close());
    return;
  }

  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch(err){
    body.innerHTML = `
      <div class="scanner-error">
        <strong>Não foi possível acessar a câmera.</strong><br><br>
        ${escapeHtml(err.message)}<br><br>
        Verifique se a permissão de câmera está liberada para o site.
      </div>
      <div class="scanner-footer"><button class="btn-secondary btn-block" id="scanner-close">Fechar</button></div>
    `;
    body.querySelector('#scanner-close').addEventListener('click', () => close());
    return;
  }

  body.innerHTML = `
    <div class="scanner-video-wrap">
      <video id="scanner-video" autoplay playsinline muted></video>
      <div class="scanner-reticle"></div>
      <div class="scanner-hint">Aponte a câmera para o código de barras</div>
    </div>
    <div class="scanner-footer"><button class="btn-secondary btn-block" id="scanner-close">Cancelar</button></div>
  `;
  const video = body.querySelector('#scanner-video');
  video.srcObject = stream;
  body.querySelector('#scanner-close').addEventListener('click', () => close(stream));

  const detector = new BarcodeDetector({
    formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'codabar']
  });

  async function loop(){
    if(stopped) return;
    try{
      const codes = await detector.detect(video);
      if(codes.length > 0){
        const value = codes[0].rawValue;
        beepScan();
        close(stream);
        state.search = value;
        render();
        const matches = searchProducts(value, state.products);
        if(matches.length === 1){
          state.selectedProduct = matches[0];
          state.qty = '';
          render();
          setTimeout(() => { const q = document.getElementById('qty-input'); if(q) q.focus(); }, 0);
        } else {
          showToast(matches.length === 0 ? 'Nenhum produto encontrado para esse código.' : 'Vários produtos encontrados — selecione na lista.', matches.length === 0);
        }
        return;
      }
    } catch(err){ /* frame sem código — ignora e tenta o próximo */ }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

async function doLancar(){
  const qtyVal = parseFloat(state.qty);
  if(!qtyVal || qtyVal <= 0){
    showToast('Informe uma quantidade válida.', true);
    return;
  }
  state.busy = true; render();
  try{
    await addCount(state.session.id, state.selectedProduct.sku, qtyVal);
    state.sessionLog.push({ sku: state.selectedProduct.sku, desc: state.selectedProduct.descricao, qty: qtyVal });
    showToast('Lançado: ' + qtyVal + ' kg — ' + state.selectedProduct.descricao);
    state.selectedProduct = null;
    state.search = '';
    state.qty = '';
  } catch(err){
    showToast('Erro ao lançar: ' + err.message, true);
  }
  state.busy = false;
  render();
  setTimeout(() => { const s = document.getElementById('search-input'); if(s) s.focus(); }, 0);
}

loadSessionsScreen();
</script>
