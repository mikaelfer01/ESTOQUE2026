<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem de Estoque</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2d3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque WMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --shell: #1d2d3e;
    --shell-dark: #16232f;
    --brand: #0a6ed1;
    --brand-dark: #085caf;
    --bg: #f5f6f7;
    --surface: #ffffff;
    --ink: #1d2d3e;
    --ink-soft: #6a6d78;
    --line: #d9dde1;
    --ok: #107e3e;
    --ok-bg: #e6f4ea;
    --warning: #df6e0c;
    --warning-bg: #fdf1e2;
    --danger: #bb0000;
    --danger-bg: #fbe9e9;
    font-size: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }

  .shellbar{
    background: linear-gradient(180deg, var(--shell), var(--shell-dark));
    color:#fff; padding:0 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .shellbar-inner{
    max-width:640px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:6px 14px; padding:12px 0;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.98rem; letter-spacing:0.01em; white-space:nowrap; }
  .brand-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:5px; background:var(--brand);
    font-size:0.8rem; font-weight:800;
  }
  .brand-accent{ color:#8fc4ff; font-weight:400; }
  .shell-nav{ display:flex; gap:4px; flex-wrap:wrap; }
  .shell-nav a{
    color:rgba(255,255,255,0.72); text-decoration:none; font-size:0.82rem; font-weight:600;
    padding:6px 10px; border-radius:4px; transition: background 0.12s ease, color 0.12s ease;
  }
  .shell-nav a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .shell-nav a.active{ background:var(--brand); color:#fff; }

  .wrap{ max-width: 640px; margin: 0 auto; padding: 20px 12px 80px; }

  h1{
    font-size:1.5rem; margin: 0 0 4px; font-weight:700;
    letter-spacing: -0.01em; color:var(--shell);
  }
  .sub{ color:var(--ink-soft); font-size:0.9rem; margin-bottom:18px; }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(29,45,62,0.06);
  }

  .section-label{
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); margin-bottom:10px;
  }

  .session-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border:1px solid var(--line); border-radius:5px;
    background:var(--surface); margin-bottom:8px; border-left:3px solid var(--brand);
  }
  .session-row .lbl{ font-weight:700; font-size:0.92rem; }
  .session-row .status{ font-size:0.75rem; color:var(--warning); font-weight:600; }

  button{
    font-family: inherit; cursor:pointer; border:none;
    border-radius:5px; font-weight:600; font-size:0.9rem;
    padding: 10px 16px; transition: background 0.12s ease, transform 0.05s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--brand); color:#fff; }
  .btn-primary:hover{ background: var(--brand-dark); }
  .btn-secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ background:#eef0f2; }
  .btn-danger{ background: var(--danger); color:#fff; }
  .btn-danger:hover{ background:#970000; }
  .btn-block{ width:100%; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  .field label{ display:block; font-size:0.78rem; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:5px; font-size:1rem; background:var(--surface); color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--brand); outline-offset:-1px; }
  .field{ margin-bottom:14px; }

  .search-results{ max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:5px; background:var(--surface); }
  .prod-item{ padding:11px 12px; border-bottom:1px solid #eef0f2; cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
  .prod-item:last-child{ border-bottom:none; }
  .prod-item:hover{ background: #f0f6fd; }
  .prod-sku{ font-family:'Consolas', 'Courier New', monospace; font-weight:700; font-size:0.82rem; color:var(--brand-dark); white-space:nowrap; }
  .prod-desc{ font-size:0.88rem; color:var(--ink-soft); text-align:right; }

  .selected-product{
    display:flex; justify-content:space-between; align-items:center;
    background: #f0f6fd; border:1px solid var(--brand); border-radius:5px;
    padding: 12px 14px; margin-bottom:14px;
  }
  .selected-product .name{ font-weight:700; }
  .selected-product .sku{ font-family:'Consolas', 'Courier New', monospace; font-size:0.8rem; color:var(--ink-soft); }
  .clear-sel{ background:none; border:none; color:var(--ink-soft); font-size:1.2rem; padding:0 4px; }

  .header-bar{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px;
    margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .header-bar .sess-label{ font-weight:700; font-size:1rem; word-break:break-word; }
  .header-bar .sess-sub{ font-size:0.75rem; color:var(--ok); font-weight:600; }
  .header-bar #finish-btn{ flex-shrink:0; }

  .log{ margin-top:18px; }
  .log h3{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }
  .log-item{
    display:flex; justify-content:space-between; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:0.9rem;
  }
  .log-qty{ font-weight:700; color:var(--ok); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--shell); color:#fff; padding:12px 20px; border-radius:5px;
    font-size:0.9rem; opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease;
    max-width:90vw; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .toast.error{ background: var(--danger); }

  .empty{ text-align:center; color:var(--ink-soft); padding:24px 10px; font-size:0.9rem; }
  .spinner{
    width:18px; height:18px; border:2px solid rgba(255,255,255,0.35);
    border-top-color:#fff; border-radius:50%; display:inline-block;
    animation: spin 0.7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,25,35,0.55);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{ background:var(--surface); border-radius:8px; padding:22px; max-width:380px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.25); }
  .modal h3{ margin-top:0; color:var(--shell); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions button{ flex:1; }

  @media (max-width: 420px){
    .header-bar{ flex-direction:column; align-items:stretch; }
    .header-bar #finish-btn{ width:100%; }
    .prod-item{ flex-direction:column; align-items:flex-start; gap:2px; }
    .prod-desc{ text-align:left; }
  }
</style>
</head>
<body>
<header class="shellbar">
  <div class="shellbar-inner">
    <div class="brand"><span class="brand-icon">E</span>Estoque<span class="brand-accent">WMS</span></div>
    <nav class="shell-nav">
      <a href="index.html" class="active">Contagem</a>
      <a href="resultados.html">Resultados</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>
<div class="wrap" id="app">
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script>
let state = {
  view: 'loading', // loading | sessions | counting
  openSessions: [],
  products: [],
  session: null, // {id, column, label}
  search: '',
  selectedProduct: null,
  qty: '',
  sessionLog: [], // {sku, desc, qty, time}
  busy: false,
  confirmFinish: false
};

function render(){
  const c = document.getElementById('content');
  if(state.view === 'loading'){
    c.innerHTML = `<div class="empty"><span class="spinner" style="border-color:rgba(0,0,0,0.15); border-top-color:var(--ink);"></span><br><br>Carregando...</div>`;
    return;
  }
  if(state.view === 'sessions'){
    c.innerHTML = renderSessions();
    attachSessionEvents();
    return;
  }
  if(state.view === 'counting'){
    c.innerHTML = renderCounting();
    attachCountingEvents();
    return;
  }
}

function renderSessions(){
  let sessionsHtml = '';
  if(state.openSessions.length === 0){
    sessionsHtml = `<div class="empty">Nenhuma contagem aberta no momento.</div>`;
  } else {
    sessionsHtml = state.openSessions.map(s => `
      <div class="session-row">
        <div>
          <div class="lbl">${escapeHtml(s.label)}</div>
          <div class="status">● aberta</div>
        </div>
        <button class="btn-secondary" data-join="${escapeHtml(s.id)}" data-label="${escapeHtml(s.label)}">Entrar</button>
      </div>
    `).join('');
  }
  return `
    <h1>Iniciar contagem</h1>
    <div class="sub">Entre numa contagem já aberta por outro colega, ou comece uma nova.</div>
    <div class="panel">
      <div class="field"><label>Contagens em aberto</label></div>
      ${sessionsHtml}
    </div>
    <button class="btn-primary btn-block" id="new-session" ${state.busy ? 'disabled' : ''}>
      ${state.busy ? '<span class="spinner"></span>' : '+ Iniciar nova contagem'}
    </button>
  `;
}

function renderCounting(){
  const filtered = state.search.trim() === '' ? [] : searchProducts(state.search, state.products);

  let selBlock = '';
  if(state.selectedProduct){
    selBlock = `
      <div class="selected-product">
        <div>
          <div class="name">${escapeHtml(state.selectedProduct.descricao)}</div>
          <div class="sku">${escapeHtml(state.selectedProduct.sku)}</div>
        </div>
        <button class="clear-sel" id="clear-sel">✕</button>
      </div>
      <div class="field">
        <label>Quantidade (kg)</label>
        <input type="number" inputmode="decimal" step="any" min="0" id="qty-input" placeholder="0.0" value="${state.qty}">
      </div>
      <button class="btn-primary btn-block" id="lancar-btn" ${state.busy ? 'disabled' : ''}>
        ${state.busy ? '<span class="spinner"></span>' : 'Lançar quantidade'}
      </button>
    `;
  } else {
    selBlock = `
      <div class="field">
        <label>Buscar produto (SKU ou descrição)</label>
        <input type="text" id="search-input" placeholder="Ex: 4521 ou filé de peito" value="${escapeHtml(state.search)}" autocomplete="off">
      </div>
      <div class="search-results">
        ${ state.search.trim() === '' ? `<div class="empty">Digite para buscar um produto.</div>`
          : filtered.length === 0 ? `<div class="empty">Nenhum produto encontrado.</div>`
          : filtered.map(p => `
              <div class="prod-item" data-sku="${escapeHtml(p.sku)}">
                <span class="prod-sku">${escapeHtml(p.sku)}</span>
                <span class="prod-desc">${escapeHtml(p.descricao)}</span>
              </div>
            `).join('')
        }
      </div>
    `;
  }

  let logBlock = '';
  if(state.sessionLog.length > 0){
    logBlock = `
      <div class="log">
        <h3>LANÇAMENTOS NESTA SESSÃO (VOCÊ)</h3>
        ${state.sessionLog.slice().reverse().map(l => `
          <div class="log-item">
            <span>${escapeHtml(l.desc)} <span style="color:var(--ink-soft); font-family:'Courier New',monospace;">(${escapeHtml(l.sku)})</span></span>
            <span class="log-qty">+${l.qty} kg</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  const modal = state.confirmFinish ? `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>Finalizar esta contagem?</h3>
        <p style="color:var(--ink-soft); font-size:0.9rem;">Depois de finalizada, ninguém mais poderá lançar quantidades nesta sessão. A coluna fica registrada na planilha normalmente.</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancel-finish">Cancelar</button>
          <button class="btn-danger" id="confirm-finish-btn">Finalizar</button>
        </div>
      </div>
    </div>
  ` : '';

  return `
    <div class="header-bar">
      <div>
        <div class="sess-label">${escapeHtml(state.session.label)}</div>
        <div class="sess-sub">contagem em andamento</div>
      </div>
      <button class="btn-danger" id="finish-btn">Finalizar contagem</button>
    </div>
    <div class="panel">
      ${selBlock}
    </div>
    ${logBlock}
    ${modal}
  `;
}

// ---- Busca dinâmica de produtos ----
// Remove acentos, ignora maiúsc/minúsc e caracteres de pontuação/separadores,
// pra digitação como "file frango", "filé-frango" ou "FILE DE FRANGO" acharem o mesmo produto.
function normalizeStr(s){
  return String(s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function searchProducts(query, products){
  const qNorm = normalizeStr(query);
  if(!qNorm) return [];
  const tokens = qNorm.split(' ').filter(Boolean);

  const scored = [];
  for(const p of products){
    const skuNorm = normalizeStr(p.sku);
    const descNorm = normalizeStr(p.descricao);
    const haystack = skuNorm + ' ' + descNorm;

    // cada palavra digitada precisa aparecer em algum lugar (SKU ou descrição),
    // em qualquer ordem — permite digitar as palavras do produto fora de ordem.
    let allTokensMatch = true;
    let score = 0;
    for(const t of tokens){
      const idx = haystack.indexOf(t);
      if(idx === -1){ allTokensMatch = false; break; }
      score += idx; // match mais cedo no texto = mais relevante
    }
    if(!allTokensMatch) continue;

    // bônus de relevância: match exato ou no início ganham prioridade
    if(skuNorm === qNorm || descNorm === qNorm) score -= 10000;
    else if(skuNorm.startsWith(qNorm) || descNorm.startsWith(qNorm)) score -= 5000;

    scored.push({ p, score });
  }

  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 40).map(s => s.p);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
}

// ---- API calls ----
async function getProducts(){
  const res = await fetch('/api/products');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function getOpenSessions(){
  const res = await fetch('/api/sessions');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function startSession(){
  const res = await fetch('/api/sessions', { method: 'POST' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function addCount(sessionId, sku, qtd){
  const res = await fetch('/api/counts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, sku, qtd })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function finishSession(sessionId){
  const res = await fetch(`/api/sessions/${sessionId}/finish`, { method: 'POST' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadSessionsScreen(){
  state.view = 'loading'; render();
  try{
    const [prodRes, sessRes] = await Promise.all([getProducts(), getOpenSessions()]);
    state.products = prodRes.products;
    state.openSessions = sessRes.sessions;
    state.view = 'sessions';
  } catch(err){
    showToast('Erro ao carregar: ' + err.message, true);
    state.view = 'sessions';
    state.openSessions = [];
  }
  render();
}

function attachSessionEvents(){
  document.getElementById('new-session').addEventListener('click', async () => {
    state.busy = true; render();
    try{
      const r = await startSession();
      state.session = { id: r.sessionId, label: r.label };
      state.sessionLog = [];
      state.selectedProduct = null;
      state.search = '';
      state.view = 'counting';
      showToast('Contagem iniciada: ' + r.label);
    } catch(err){
      showToast('Erro ao iniciar contagem: ' + err.message, true);
    }
    state.busy = false;
    render();
  });

  document.querySelectorAll('[data-join]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.session = { id: btn.dataset.join, label: btn.dataset.label };
      state.sessionLog = [];
      state.selectedProduct = null;
      state.search = '';
      state.view = 'counting';
      showToast('Você entrou na contagem: ' + btn.dataset.label);
      render();
    });
  });
}

function attachCountingEvents(){
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      render();
      const el = document.getElementById('search-input');
      el.focus();
      el.selectionStart = el.selectionEnd = el.value.length;
    });
    document.querySelectorAll('.prod-item').forEach(item => {
      item.addEventListener('click', () => {
        const sku = item.dataset.sku;
        state.selectedProduct = state.products.find(p => p.sku === sku);
        state.qty = '';
        render();
        setTimeout(() => { const q = document.getElementById('qty-input'); if(q) q.focus(); }, 0);
      });
    });
  }

  const clearSel = document.getElementById('clear-sel');
  if(clearSel){
    clearSel.addEventListener('click', () => {
      state.selectedProduct = null;
      render();
      setTimeout(() => { const s = document.getElementById('search-input'); if(s) s.focus(); }, 0);
    });
  }

  const qtyInput = document.getElementById('qty-input');
  if(qtyInput){
    qtyInput.addEventListener('input', (e) => { state.qty = e.target.value; });
    qtyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLancar(); });
  }

  const lancarBtn = document.getElementById('lancar-btn');
  if(lancarBtn) lancarBtn.addEventListener('click', doLancar);

  const finishBtn = document.getElementById('finish-btn');
  if(finishBtn) finishBtn.addEventListener('click', () => { state.confirmFinish = true; render(); });

  const cancelFinish = document.getElementById('cancel-finish');
  if(cancelFinish) cancelFinish.addEventListener('click', () => { state.confirmFinish = false; render(); });

  const confirmFinishBtn = document.getElementById('confirm-finish-btn');
  if(confirmFinishBtn) confirmFinishBtn.addEventListener('click', async () => {
    state.busy = true;
    try{
      await finishSession(state.session.id);
      showToast('Contagem finalizada.');
      state.confirmFinish = false;
      state.session = null;
      await loadSessionsScreen();
      return;
    } catch(err){
      showToast('Erro ao finalizar: ' + err.message, true);
    }
    state.busy = false;
    state.confirmFinish = false;
    render();
  });
}

async function doLancar(){
  const qtyVal = parseFloat(state.qty);
  if(!qtyVal || qtyVal <= 0){
    showToast('Informe uma quantidade válida.', true);
    return;
  }
  state.busy = true; render();
  try{
    await addCount(state.session.id, state.selectedProduct.sku, qtyVal);
    state.sessionLog.push({ sku: state.selectedProduct.sku, desc: state.selectedProduct.descricao, qty: qtyVal });
    showToast('Lançado: ' + qtyVal + ' kg — ' + state.selectedProduct.descricao);
    state.selectedProduct = null;
    state.search = '';
    state.qty = '';
  } catch(err){
    showToast('Erro ao lançar: ' + err.message, true);
  }
  state.busy = false;
  render();
  setTimeout(() => { const s = document.getElementById('search-input'); if(s) s.focus(); }, 0);
}

loadSessionsScreen();
</script>
</body>
</html>
