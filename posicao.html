<style>
  :root{
    --shell: #1d2d3e;
    --shell-dark: #16232f;
    --brand: #0a6ed1;
    --brand-dark: #085caf;
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-raised: #eef1f4;
    --ink: #1d2d3e;
    --ink-soft: #6a6d78;
    --line: #d9dde1;
    --ok: #107e3e;
    --ok-bg: #e6f4ea;
    --warning: #df6e0c;
    --warning-bg: #fdf1e2;
    --danger: #bb0000;
    --danger-bg: #fbe9e9;
    font-size: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }

  .shellbar{
    background: linear-gradient(180deg, var(--shell), var(--shell-dark));
    color:#fff; padding:0 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .shellbar-inner{
    max-width:640px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:6px 14px; padding:12px 0;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.98rem; letter-spacing:0.01em; white-space:nowrap; }
  .brand-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:5px; background:var(--brand);
    font-size:0.8rem; font-weight:800;
  }
  .brand-accent{ color:#8fc4ff; font-weight:400; }
  .shell-nav{ display:flex; gap:4px; flex-wrap:wrap; }
  .shell-nav a{
    color:rgba(255,255,255,0.72); text-decoration:none; font-size:0.82rem; font-weight:600;
    padding:6px 10px; border-radius:4px; transition: background 0.12s ease, color 0.12s ease;
  }
  .shell-nav a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .shell-nav a.active{ background:var(--brand); color:#fff; }

  .page-shell{
    display:flex; flex-direction:column; justify-content:center;
    min-height: calc(100vh - 61px); min-height: calc(100dvh - 61px);
  }
  .page-shell.top-align{ justify-content:flex-start; }
  .wrap{ max-width: 640px; width:100%; margin: 0 auto; padding: 14px 12px 24px; }

  h1{ font-size:1.15rem; margin: 0 0 10px; font-weight:700; letter-spacing: -0.01em; color:var(--ink); }

  .panel{
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;

  .f-group{ padding: 11px 0; border-bottom:1px solid var(--line); }
  .f-group:last-child{ border-bottom:none; }
  .f-label{
    font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); margin-bottom:8px;
  }

  button{
    font-family: inherit; cursor:pointer; border:none;
    border-radius:5px; font-weight:600; font-size:0.9rem;
    padding: 10px 16px; transition: background 0.12s ease, transform 0.05s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--brand); color:#fff; }
  .btn-primary:hover{ background: var(--brand-dark); }
  .btn-secondary{ background:var(--surface-raised); color:var(--ink); border:1px solid var(--line); }

  .btn-block{ width:100%; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  input[type="text"], input[type="number"]{
    width:100%; min-height:46px; padding:10px 12px; border:1px solid var(--line);
    border-radius:6px; font-size:1rem; background:var(--surface-raised); color:var(--ink);
  }
  input:focus{ outline:2px solid var(--brand); outline-offset:-1px; }

  .session-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border:1px solid var(--line); border-radius:5px;
    background:var(--surface); margin-bottom:8px; border-left:3px solid var(--brand);
  }
  .session-row .lbl{ font-weight:700; font-size:0.92rem; }
  .session-row .status{ font-size:0.75rem; color:var(--warning); font-weight:600; }

  .header-bar{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px;
    margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .header-bar .sess-label{ font-weight:700; font-size:1rem; word-break:break-word; }
  .header-bar .sess-sub{ font-size:0.75rem; color:var(--ok); font-weight:600; }
  .header-bar #finish-session-btn{ flex-shrink:0; }

  .btn-danger{ background: var(--danger); color:#fff; }
  .btn-danger:hover{ background:#970000; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions button{ flex:1; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,25,35,0.55);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{ background:var(--surface); border-radius:8px; padding:22px; max-width:380px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.25); }

  .scan-row{ display:flex; gap:10px; }
  .scan-row input{ flex:1; min-width:0; }
  .scan-btn{
    display:flex; align-items:center; justify-content:center;
    background: var(--surface-raised); color:var(--brand); border:1px solid var(--brand);
    flex-shrink:0; width:46px; font-size:1.2rem; padding:0;
  }

  .posicao-active{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--ok-bg); border:1px solid var(--ok); border-radius:5px;
    padding: 10px 14px;
  }
  .posicao-active .val{ font-family:'Consolas','Courier New', monospace; font-weight:700; color:var(--ok); font-size:1.05rem; }
  .posicao-active .lbl{ font-size:0.7rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }

  .scanner-modal .modal{ max-width:480px; padding:0; overflow:hidden; background:#000; }
  .scanner-video-wrap{ position:relative; width:100%; aspect-ratio: 3/4; background:#000; }
  .scanner-video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .scanner-reticle{
    position:absolute; left:12%; right:12%; top:32%; bottom:32%;
    border:2px solid var(--ok); border-radius:6px; box-shadow:0 0 0 999px rgba(0,0,0,0.35);
  }
  .scanner-hint{
    position:absolute; left:0; right:0; bottom:12px; text-align:center;
    color:#fff; font-size:0.8rem; text-shadow:0 1px 3px rgba(0,0,0,0.8);
  }
  .scanner-footer{ padding:14px 16px; background:var(--surface); }
  .scanner-error{ padding:20px 16px; color:#fff; font-size:0.9rem; }

  .search-results{ max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:5px; background:var(--surface-raised); margin-top:10px; }
  .prod-item{ padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
  .prod-item:last-child{ border-bottom:none; }
  .prod-item:hover{ background: var(--surface); }
  .prod-sku{ font-family:'Consolas', 'Courier New', monospace; font-weight:700; font-size:0.82rem; color:var(--ok); white-space:nowrap; }
  .prod-desc{ font-size:0.88rem; color:var(--ink-soft); text-align:right; }

  .selected-product{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--surface-raised); border:1px solid var(--brand); border-radius:5px;
    padding: 12px 14px;
  }
  .selected-product .name{ font-weight:700; }
  .selected-product .sku{ font-family:'Consolas', 'Courier New', monospace; font-size:0.8rem; color:var(--ink-soft); }
  .clear-sel{ background:none; border:none; color:var(--ink-soft); font-size:1.2rem; padding:0 4px; }

  .qty-readout{
    background:var(--ok-bg); border:1px solid var(--ok); border-radius:6px;
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  .qty-readout input{
    font-family:'Consolas','Courier New', monospace; font-size:2.1rem; font-weight:700;
    color:var(--ok); background:transparent; border:none; width:100%; padding:0;
    letter-spacing:0.02em;
  }
  .qty-readout input:focus{ outline:none; }
  .qty-readout .unit{ color:var(--ok); opacity:0.75; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; }

  .log{ margin-top:18px; }
  .log h3{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }
  .log-item{ padding:10px 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .log-item .top{ display:flex; justify-content:space-between; gap:10px; }
  .log-item .desc{ font-weight:600; }
  .log-item .qty{ font-weight:700; color:var(--ok); white-space:nowrap; }
  .log-item .meta{ font-size:0.76rem; color:var(--ink-soft); margin-top:2px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--shell); color:#fff; border:none;
    padding:12px 20px; border-radius:5px;
    font-size:0.9rem; opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease;
    max-width:90vw; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .toast.error{ background: var(--danger); }

  .empty{ text-align:center; color:var(--ink-soft); padding:16px 10px; font-size:0.88rem; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(255,255,255,0.35);
    border-top-color:#fff; border-radius:50%; display:inline-block;
    animation: spin 0.7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width: 420px){
    .prod-item{ flex-direction:column; align-items:flex-start; gap:2px; }
    .prod-desc{ text-align:left; }
  }
</style>

  <div class="wrap">
    <h1>Lançamento por posição</h1>
    <div id="content"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script>
let state = {
  view: 'loading', // loading | sessions | launching
  products: [],
  openSessions: [],
  session: null, // {id, label}
  posicao: '',
  search: '',
  selectedProduct: null,
  qty: '',
  busy: false,
  log: [],
  confirmFinish: false
};

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
  if(isError) beepError(); else beepOk();
}

// ---- Bipe de coletor de dados (gerado via Web Audio, sem arquivo de áudio) ----
function getAudioCtx(){
  if(!getAudioCtx._ctx) getAudioCtx._ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(getAudioCtx._ctx.state === 'suspended') getAudioCtx._ctx.resume();
  return getAudioCtx._ctx;
}
function beep(freq, durationMs, volume){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain).connect(ctx.destination);
    const now = ctx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);
    osc.stop(now + durationMs / 1000 + 0.02);
  } catch(err){ /* áudio bloqueado/indisponível — segue sem som */ }
}
function beepScan(){ beep(2200, 90, 0.25); }
function beepOk(){ beep(1400, 90, 0.2); }
function beepError(){ beep(220, 260, 0.25); }

// ---- Busca ampla de produto (mesma lógica tolerante a acento/ordem do app de contagem) ----
function normalizeStr(s){
  return String(s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function searchProducts(query, products){
  const qNorm = normalizeStr(query);
  if(!qNorm) return [];
  const tokens = qNorm.split(' ').filter(Boolean);
  const scored = [];
  for(const p of products){
    const skuNorm = normalizeStr(p.sku);
    const descNorm = normalizeStr(p.descricao);
    const haystack = skuNorm + ' ' + descNorm;
    let allTokensMatch = true;
    let score = 0;
    for(const t of tokens){
      const idx = haystack.indexOf(t);
      if(idx === -1){ allTokensMatch = false; break; }
      score += idx;
    }
    if(!allTokensMatch) continue;
    if(skuNorm === qNorm || descNorm === qNorm) score -= 10000;
    else if(skuNorm.startsWith(qNorm) || descNorm.startsWith(qNorm)) score -= 5000;
    scored.push({ p, score });
  }
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 40).map(s => s.p);
}

// Atualiza só a lista de resultados da busca, sem recriar o <input> —
// recriar o campo a cada tecla fazia o teclado do Android reiniciar
// (voltando pra letras) toda vez que um número era digitado.
function renderSearchResults(){
  const box = document.getElementById('search-results-box');
  if(!box) return;
  const term = state.search.trim();
  if(term === ''){ box.innerHTML = ''; return; }
  const filtered = searchProducts(term, state.products);
  box.innerHTML = filtered.length === 0
    ? `<div class="empty">Nenhum produto encontrado.</div>`
    : filtered.map(p => `
        <div class="prod-item" data-sku="${escapeHtml(p.sku)}">
          <span class="prod-sku">${escapeHtml(p.sku)}</span>
          <span class="prod-desc">${escapeHtml(p.descricao)}</span>
        </div>
      `).join('');
}

async function getProducts(){
  const res = await fetch('/api/products');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function getOpenSessions(){
  const res = await fetch('/api/sessions?tipo=posicao');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function startSession(){
  const res = await fetch('/api/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo: 'posicao' })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function finishSession(sessionId){
  const res = await fetch(`/api/sessions/${sessionId}/finish`, { method: 'POST' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// Avisa o servidor qual posição está sendo lida agora — não bloqueia o
// fluxo de contagem se falhar, é só pro modo auditor acompanhar ao vivo.
function updateCurrentPosition(posicao){
  fetch(`/api/sessions/${state.session.id}/posicao-atual`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ posicao })
  }).catch(() => {});
}

// Converte o link do QR (posicao_id=NNN) ou o código de barras pro código
// fantasia usando o mesmo mapa do servidor, pra já exibir o nome certo
// na tela em vez do link cru.
async function resolverPosicao(valor){
  try{
    const res = await fetch('/api/resolver-posicao?valor=' + encodeURIComponent(valor));
    const data = await res.json();
    if(data.error) return { resolvida: valor, mapeado: true };
    return data;
  } catch(err){
    return { resolvida: valor, mapeado: true };
  }
}

async function lancarPosicao(payload){
  const res = await fetch('/api/posicao', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ---- Gera e baixa a planilha (CSV) com os lançamentos desta sessão ----
function downloadCsv(filename, headers, rows){
  const escapeCsv = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const lines = [headers.map(escapeCsv).join(';')];
  rows.forEach(r => lines.push(r.map(escapeCsv).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function baixarPlanilhaSessao(sessionId, label){
  const res = await fetch(`/api/posicao?sessionId=${encodeURIComponent(sessionId)}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const rows = data.lancamentos.map(l => [l.posicao_resolvida || l.posicao, l.sku, l.descricao, Number(l.quantidade)]);
  const nomeArquivo = 'lancamentos-posicao-' + label.replace(/[^0-9a-zA-Z]+/g, '-') + '.csv';
  downloadCsv(nomeArquivo, ['Posicao', 'SKU', 'Descricao', 'Quantidade_kg'], rows);
}

async function loadSessionsScreen(){
  state.view = 'loading'; render();
  try{
    const [prodRes, sessRes] = await Promise.all([getProducts(), getOpenSessions()]);
    state.products = prodRes.products;
    state.openSessions = sessRes.sessions;
    state.view = 'sessions';
  } catch(err){
    showToast('Erro ao carregar: ' + err.message, true);
    state.view = 'sessions';
    state.openSessions = [];
  }
  render();
}

function render(){
  const c = document.getElementById('content');
  const shell = document.getElementById('pageShell');
  shell.classList.toggle('top-align', state.view === 'launching');

  if(state.view === 'loading'){
    c.innerHTML = `<div class="empty"><span class="spinner" style="border-color:rgba(0,0,0,0.12); border-top-color:var(--brand);"></span><br><br>Carregando...</div>`;
    return;
  }
  if(state.view === 'sessions'){
    c.innerHTML = renderSessions();
    attachSessionEvents();
    return;
  }
  if(state.view === 'launching'){
    c.innerHTML = renderLaunching();
    attachLaunchingEvents();
    return;
  }
}

function renderSessions(){
  let sessionsHtml = '';
  if(state.openSessions.length === 0){
    sessionsHtml = `<div class="empty">Nenhuma sessão aberta.</div>`;
  } else {
    sessionsHtml = state.openSessions.map(s => `
      <div class="session-row">
        <div>
          <div class="lbl">${escapeHtml(s.label)}</div>
          <div class="status">● aberta</div>
        </div>
        <button class="btn-secondary" data-join="${escapeHtml(s.id)}" data-label="${escapeHtml(s.label)}">Entrar</button>
      </div>
    `).join('');
  }
  return `
    <div class="panel">
      <div class="f-label">Sessões abertas</div>
      ${sessionsHtml}
    </div>
    <button class="btn-primary btn-block" id="new-session" ${state.busy ? 'disabled' : ''}>
      ${state.busy ? '<span class="spinner"></span>' : '+ Iniciar nova sessão'}
    </button>
  `;
}

function attachSessionEvents(){
  document.getElementById('new-session').addEventListener('click', async () => {
    state.busy = true; render();
    try{
      const r = await startSession();
      state.session = { id: r.sessionId, label: r.label };
      state.log = [];
      state.posicao = '';
      state.selectedProduct = null;
      state.search = '';
      state.view = 'launching';
      showToast('Sessão iniciada: ' + r.label);
    } catch(err){
      showToast('Erro ao iniciar sessão: ' + err.message, true);
    }
    state.busy = false;
    render();
  });

  document.querySelectorAll('[data-join]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.session = { id: btn.dataset.join, label: btn.dataset.label };
      state.log = [];
      state.posicao = '';
      state.selectedProduct = null;
      state.search = '';
      state.view = 'launching';
      showToast('Você entrou na sessão: ' + btn.dataset.label);
      render();
    });
  });
}

function renderLaunching(){
  const posicaoBlock = state.posicao ? `
    <div class="posicao-active">
      <div><div class="lbl">Posição ativa</div><div class="val">${escapeHtml(state.posicao)}</div></div>
      <button type="button" class="clear-sel" id="clear-posicao">✕</button>
    </div>
  ` : `
    <div class="scan-row">
      <input type="text" id="posicao-input" placeholder="Ex: A-12-03" value="${escapeHtml(state.posicao)}" autocomplete="off">
      <button type="button" class="scan-btn" id="scan-posicao-btn" title="Escanear QR da posição"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"></path><rect x="9" y="9" width="6" height="6" rx="0.8"></rect></svg></button>
    </div>
  `;

  let produtoBlock = '';
  if(state.selectedProduct){
    produtoBlock = `
      <div class="selected-product">
        <div>
          <div class="name">${escapeHtml(state.selectedProduct.descricao)}</div>
          <div class="sku">${escapeHtml(state.selectedProduct.sku)}</div>
        </div>
        <button type="button" class="clear-sel" id="clear-produto">✕</button>
      </div>
    `;
  } else {
    produtoBlock = `
      <input type="text" id="search-input" placeholder="Código (SKU) ou nome do produto" value="${escapeHtml(state.search)}" autocomplete="off">
      <div class="search-results" id="search-results-box"></div>
    `;
  }

  let logBlock = '';
  if(state.log.length > 0){
    logBlock = `
      <div class="log">
        <h3>Lançamentos (você)</h3>
        ${state.log.slice().reverse().map(l => `
          <div class="log-item">
            <div class="top">
              <span class="desc">${escapeHtml(l.descricao)}</span>
              <span class="qty">${l.quantidade} kg</span>
            </div>
            <div class="meta">Posição ${escapeHtml(l.posicao)} · SKU ${escapeHtml(l.sku)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  const modal = state.confirmFinish ? `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>Finalizar sessão?</h3>
        <p style="color:var(--ink-soft); font-size:0.9rem;">Ninguém mais poderá lançar nesta sessão. A planilha com todos os lançamentos é baixada em seguida.</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancel-finish">Cancelar</button>
          <button class="btn-danger" id="confirm-finish-btn">Finalizar</button>
        </div>
      </div>
    </div>
  ` : '';

  return `
    <div class="header-bar">
      <div>
        <div class="sess-label">${escapeHtml(state.session.label)}</div>
        <div class="sess-sub">● aberta</div>
      </div>
      <button class="btn-danger" id="finish-session-btn">Finalizar</button>
    </div>
    <div class="panel">
      <div class="f-group">
        <div class="f-label">Posição</div>
        ${posicaoBlock}
      </div>

      <div class="f-group">
        <div class="f-label">Produto</div>
        ${produtoBlock}
      </div>

      <div class="f-group">
        <div class="f-label">Quantidade</div>
        <div class="qty-readout">
          <input type="number" inputmode="decimal" step="any" min="0" id="qty-input" placeholder="0.0" value="${escapeHtml(state.qty)}">
          <div class="unit">kg</div>
        </div>
      </div>
    </div>

    <button class="btn-primary btn-block" id="lancar-btn" ${state.busy ? 'disabled' : ''}>
      ${state.busy ? '<span class="spinner"></span>' : 'Lançar'}
    </button>
    <button class="btn-secondary btn-block" id="vazia-btn" style="margin-top:8px;" ${state.busy ? 'disabled' : ''}>
      Marcar posição como vazia
    </button>
    ${logBlock}
    ${modal}
  `;
}

function attachLaunchingEvents(){
  const posicaoInput = document.getElementById('posicao-input');
  if(posicaoInput){
    posicaoInput.addEventListener('input', (e) => { state.posicao = e.target.value; });
    posicaoInput.addEventListener('keydown', async (e) => {
      if(e.key === 'Enter'){
        const raw = e.target.value.trim();
        if(!raw){ render(); return; }
        const { resolvida, mapeado } = await resolverPosicao(raw);
        state.posicao = resolvida;
        updateCurrentPosition(state.posicao);
        if(mapeado === false) showToast('Posição não mapeada — cadastre no Admin.', true);
        render();
      }
    });
  }
  const scanPosBtn = document.getElementById('scan-posicao-btn');
  if(scanPosBtn) scanPosBtn.addEventListener('click', () => openScanner(['qr_code'], async (value) => {
    const raw = value.trim();
    const { resolvida, mapeado } = await resolverPosicao(raw);
    state.posicao = resolvida;
    updateCurrentPosition(state.posicao);
    if(mapeado === false) showToast('Posição não mapeada — cadastre no Admin.', true);
    render();
  }));
  const clearPosicao = document.getElementById('clear-posicao');
  if(clearPosicao) clearPosicao.addEventListener('click', () => { state.posicao = ''; render(); });

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    renderSearchResults();
    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      renderSearchResults();
    });
  }
  const resultsBox = document.getElementById('search-results-box');
  if(resultsBox){
    resultsBox.addEventListener('click', (e) => {
      const item = e.target.closest('.prod-item');
      if(!item) return;
      const sku = item.dataset.sku;
      state.selectedProduct = state.products.find(p => p.sku === sku);
      render();
      setTimeout(() => { const q = document.getElementById('qty-input'); if(q) q.focus(); }, 0);
    });
  }
  const clearProduto = document.getElementById('clear-produto');
  if(clearProduto) clearProduto.addEventListener('click', () => { state.selectedProduct = null; state.search = ''; render(); });

  const qtyInput = document.getElementById('qty-input');
  if(qtyInput){
    qtyInput.addEventListener('input', (e) => { state.qty = e.target.value; });
    qtyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLancar(); });
  }

  const lancarBtn = document.getElementById('lancar-btn');
  if(lancarBtn) lancarBtn.addEventListener('click', doLancar);

  const vaziaBtn = document.getElementById('vazia-btn');
  if(vaziaBtn) vaziaBtn.addEventListener('click', doLancarVazia);

  const finishBtn = document.getElementById('finish-session-btn');
  if(finishBtn) finishBtn.addEventListener('click', () => { state.confirmFinish = true; render(); });

  const cancelFinish = document.getElementById('cancel-finish');
  if(cancelFinish) cancelFinish.addEventListener('click', () => { state.confirmFinish = false; render(); });

  const confirmFinishBtn = document.getElementById('confirm-finish-btn');
  if(confirmFinishBtn) confirmFinishBtn.addEventListener('click', async () => {
    state.busy = true;
    try{
      await finishSession(state.session.id);
      try{
        await baixarPlanilhaSessao(state.session.id, state.session.label);
        showToast('Sessão finalizada. Planilha baixada.');
      } catch(csvErr){
        showToast('Sessão finalizada, mas não deu pra gerar a planilha: ' + csvErr.message, true);
      }
      state.confirmFinish = false;
      state.session = null;
      await loadSessionsScreen();
      return;
    } catch(err){
      showToast('Erro ao finalizar: ' + err.message, true);
    }
    state.busy = false;
    state.confirmFinish = false;
    render();
  });
}

async function doLancar(){
  if(!state.posicao.trim()){ showToast('Escaneie ou digite a posição.', true); return; }
  if(!state.selectedProduct){ showToast('Selecione um produto.', true); return; }
  const qtyVal = parseFloat(state.qty);
  if(!qtyVal || qtyVal <= 0){ showToast('Informe uma quantidade válida.', true); return; }

  state.busy = true; render();
  try{
    const payload = {
      sessionId: state.session.id,
      posicao: state.posicao.trim(),
      sku: state.selectedProduct.sku,
      descricao: state.selectedProduct.descricao,
      quantidade: qtyVal
    };
    await lancarPosicao(payload);
    state.log.push(payload);
    showToast('Lançado: ' + qtyVal + ' kg — ' + state.selectedProduct.descricao);
    state.posicao = '';
    state.selectedProduct = null;
    state.search = '';
    state.qty = '';
  } catch(err){
    showToast('Erro ao lançar: ' + err.message, true);
  }
  state.busy = false;
  render();
  setTimeout(() => { const p = document.getElementById('posicao-input'); if(p) p.focus(); }, 0);
}

async function doLancarVazia(){
  if(!state.posicao.trim()){ showToast('Escaneie ou digite a posição.', true); return; }

  state.busy = true; render();
  try{
    const payload = {
      sessionId: state.session.id,
      posicao: state.posicao.trim(),
      vazia: true
    };
    await lancarPosicao(payload);
    state.log.push({ ...payload, sku: 'VAZIO', descricao: 'Posição vazia', quantidade: 0 });
    showToast('Posição marcada como vazia.');
    state.posicao = '';
    state.selectedProduct = null;
    state.search = '';
    state.qty = '';
  } catch(err){
    showToast('Erro ao marcar posição: ' + err.message, true);
  }
  state.busy = false;
  render();
  setTimeout(() => { const p = document.getElementById('posicao-input'); if(p) p.focus(); }, 0);
}

// ---- Leitor de QR (câmera) para a posição ----
async function openScanner(formats, onDetected){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop scanner-modal';
  backdrop.innerHTML = `<div class="modal"><div id="scanner-body"></div></div>`;
  document.body.appendChild(backdrop);
  const body = backdrop.querySelector('#scanner-body');

  let stopped = false;
  function close(stream){
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    backdrop.remove();
  }
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) close(); });

  if(!('BarcodeDetector' in window)){
    body.innerHTML = `
      <div class="scanner-error">Leitor não suportado neste navegador. Digite manualmente.</div>
      <div class="scanner-footer"><button class="btn-secondary btn-block" id="scanner-close">Fechar</button></div>
    `;
    body.querySelector('#scanner-close').addEventListener('click', () => close());
    return;
  }

  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch(err){
    body.innerHTML = `
      <div class="scanner-error">Sem acesso à câmera: ${escapeHtml(err.message)}</div>
      <div class="scanner-footer"><button class="btn-secondary btn-block" id="scanner-close">Fechar</button></div>
    `;
    body.querySelector('#scanner-close').addEventListener('click', () => close());
    return;
  }

  body.innerHTML = `
    <div class="scanner-video-wrap">
      <video id="scanner-video" autoplay playsinline muted></video>
      <div class="scanner-reticle"></div>
      <div class="scanner-hint">Aponte a câmera para o QR code</div>
    </div>
    <div class="scanner-footer"><button class="btn-secondary btn-block" id="scanner-close">Cancelar</button></div>
  `;
  const video = body.querySelector('#scanner-video');
  video.srcObject = stream;
  body.querySelector('#scanner-close').addEventListener('click', () => close(stream));

  const detector = new BarcodeDetector({ formats });

  async function loop(){
    if(stopped) return;
    try{
      const codes = await detector.detect(video);
      if(codes.length > 0){
        const value = codes[0].rawValue;
        beepScan();
        close(stream);
        onDetected(value);
        return;
      }
    } catch(err){ /* frame sem código — ignora e tenta o próximo */ }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

loadSessionsScreen();
</script>
