<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lançamento por Posição</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2d3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque WMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --shell: #1d2d3e;
    --shell-dark: #16232f;
    --brand: #0a6ed1;
    --brand-dark: #085caf;
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-raised: #eef1f4;
    --ink: #1d2d3e;
    --ink-soft: #6a6d78;
    --line: #d9dde1;
    --ok: #107e3e;
    --ok-bg: #e6f4ea;
    --warning: #df6e0c;
    --warning-bg: #fdf1e2;
    --danger: #bb0000;
    --danger-bg: #fbe9e9;
    font-size: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }

  .shellbar{
    background: linear-gradient(180deg, var(--shell), var(--shell-dark));
    color:#fff; padding:0 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .shellbar-inner{
    max-width:640px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:6px 14px; padding:12px 0;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.98rem; letter-spacing:0.01em; white-space:nowrap; }
  .brand-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:5px; background:var(--brand);
    font-size:0.8rem; font-weight:800;
  }
  .brand-accent{ color:#8fc4ff; font-weight:400; }
  .shell-nav{ display:flex; gap:4px; flex-wrap:wrap; }
  .shell-nav a{
    color:rgba(255,255,255,0.72); text-decoration:none; font-size:0.82rem; font-weight:600;
    padding:6px 10px; border-radius:4px; transition: background 0.12s ease, color 0.12s ease;
  }
  .shell-nav a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .shell-nav a.active{ background:var(--brand); color:#fff; }

  .page-shell{
    display:flex; flex-direction:column; justify-content:center;
    min-height: calc(100vh - 61px); min-height: calc(100dvh - 61px);
  }
  .page-shell.top-align{ justify-content:flex-start; }
  .wrap{ max-width: 640px; width:100%; margin: 0 auto; padding: 14px 12px 24px; }

  h1{ font-size:1.15rem; margin: 0 0 10px; font-weight:700; letter-spacing: -0.01em; color:var(--ink); }

  .panel{
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(29,45,62,0.06);
  }
  .f-group{ padding: 11px 0; border-bottom:1px solid var(--line); }
  .f-group:last-child{ border-bottom:none; }
  .f-label{
    font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); margin-bottom:8px;
  }

  button{
    font-family: inherit; cursor:pointer; border:none;
    border-radius:5px; font-weight:600; font-size:0.9rem;
    padding: 10px 16px; transition: background 0.12s ease, transform 0.05s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--brand); color:#fff; }
  .btn-primary:hover{ background: var(--brand-dark); }
  .btn-secondary{ background:var(--surface-raised); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ background:#e2e6ea; }
  .btn-block{ width:100%; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  input[type="text"], input[type="number"]{
    width:100%; min-height:46px; padding:10px 12px; border:1px solid var(--line);
    border-radius:6px; font-size:1rem; background:var(--surface-raised); color:var(--ink);
  }
  input:focus{ outline:2px solid var(--brand); outline-offset:-1px; }

  .search-results{ max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:5px; background:var(--surface-raised); margin-top:10px; }
  .prod-item{ padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
  .prod-item:last-child{ border-bottom:none; }
  .prod-item:hover{ background: var(--surface); }
  .prod-sku{ font-family:'Consolas', 'Courier New', monospace; font-weight:700; font-size:0.82rem; color:var(--ok); white-space:nowrap; }
  .prod-desc{ font-size:0.88rem; color:var(--ink-soft); text-align:right; }

  .selected-product{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--surface-raised); border:1px solid var(--brand); border-radius:5px;
    padding: 12px 14px;
  }
  .selected-product .name{ font-weight:700; }
  .selected-product .sku{ font-family:'Consolas', 'Courier New', monospace; font-size:0.8rem; color:var(--ink-soft); }
  .clear-sel{ background:none; border:none; color:var(--ink-soft); font-size:1.2rem; padding:0 4px; }

  .qty-readout{
    background:var(--ok-bg); border:1px solid var(--ok); border-radius:6px;
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  .qty-readout input{
    font-family:'Consolas','Courier New', monospace; font-size:2.1rem; font-weight:700;
    color:var(--ok); background:transparent; border:none; width:100%; padding:0;
    letter-spacing:0.02em;
  }
  .qty-readout input:focus{ outline:none; }
  .qty-readout .unit{ color:var(--ok); opacity:0.75; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; }

  .log{ margin-top:18px; }
  .log h3{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px; font-weight:700; }
  .log-item{ padding:10px 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .log-item .top{ display:flex; justify-content:space-between; gap:10px; }
  .log-item .desc{ font-weight:600; }
  .log-item .qty{ font-weight:700; color:var(--ok); white-space:nowrap; }
  .log-item .meta{ font-size:0.76rem; color:var(--ink-soft); margin-top:2px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--shell); color:#fff; border:none;
    padding:12px 20px; border-radius:5px;
    font-size:0.9rem; opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease;
    max-width:90vw; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .toast.error{ background: var(--danger); }

  .empty{ text-align:center; color:var(--ink-soft); padding:16px 10px; font-size:0.88rem; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(255,255,255,0.35);
    border-top-color:#fff; border-radius:50%; display:inline-block;
    animation: spin 0.7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width: 420px){
    .prod-item{ flex-direction:column; align-items:flex-start; gap:2px; }
    .prod-desc{ text-align:left; }
  }
</style>
</head>
<body>
<header class="shellbar">
  <div class="shellbar-inner">
    <div class="brand"><span class="brand-icon">E</span>Estoque<span class="brand-accent">WMS</span></div>
    <nav class="shell-nav">
      <a href="index.html">Contagem</a>
      <a href="posicao.html" class="active">Posição</a>
      <a href="resultados.html">Resultados</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>
<main class="page-shell" id="pageShell">
  <div class="wrap">
    <h1>Lançamento por posição</h1>
    <div id="content"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script>
let state = {
  loading: true,
  products: [],
  search: '',
  selectedProduct: null,
  qty: '',
  busy: false,
  log: []
};

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
  if(isError) beepError(); else beepOk();
}

// ---- Bipe de coletor de dados (gerado via Web Audio, sem arquivo de áudio) ----
function getAudioCtx(){
  if(!getAudioCtx._ctx) getAudioCtx._ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(getAudioCtx._ctx.state === 'suspended') getAudioCtx._ctx.resume();
  return getAudioCtx._ctx;
}
function beep(freq, durationMs, volume){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain).connect(ctx.destination);
    const now = ctx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);
    osc.stop(now + durationMs / 1000 + 0.02);
  } catch(err){ /* áudio bloqueado/indisponível — segue sem som */ }
}
function beepOk(){ beep(1400, 90, 0.2); }
function beepError(){ beep(220, 260, 0.25); }

// ---- Busca ampla de produto (mesma lógica tolerante a acento/ordem do app de contagem) ----
function normalizeStr(s){
  return String(s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function searchProducts(query, products){
  const qNorm = normalizeStr(query);
  if(!qNorm) return [];
  const tokens = qNorm.split(' ').filter(Boolean);
  const scored = [];
  for(const p of products){
    const skuNorm = normalizeStr(p.sku);
    const descNorm = normalizeStr(p.descricao);
    const haystack = skuNorm + ' ' + descNorm;
    let allTokensMatch = true;
    let score = 0;
    for(const t of tokens){
      const idx = haystack.indexOf(t);
      if(idx === -1){ allTokensMatch = false; break; }
      score += idx;
    }
    if(!allTokensMatch) continue;
    if(skuNorm === qNorm || descNorm === qNorm) score -= 10000;
    else if(skuNorm.startsWith(qNorm) || descNorm.startsWith(qNorm)) score -= 5000;
    scored.push({ p, score });
  }
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, 40).map(s => s.p);
}

async function getProducts(){
  const res = await fetch('/api/products');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function lancarPosicao(payload){
  const res = await fetch('/api/posicao', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ---- Gera e baixa a planilha (CSV) com os lançamentos desta sessão ----
function downloadCsv(filename, headers, rows){
  const escapeCsv = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const lines = [headers.map(escapeCsv).join(';')];
  rows.forEach(r => lines.push(r.map(escapeCsv).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function finalizarEBaixarPlanilha(){
  const rows = state.log.map(l => [l.sku, l.descricao, l.quantidade]);
  const agora = new Date();
  const carimbo = agora.toISOString().slice(0, 16).replace(/[:T]/g, '-');
  downloadCsv('lancamentos-posicao-' + carimbo + '.csv', ['SKU', 'Descricao', 'Quantidade_kg'], rows);
  showToast('Planilha baixada com ' + state.log.length + ' lançamento(s).');
}

function render(){
  const c = document.getElementById('content');
  const shell = document.getElementById('pageShell');
  shell.classList.toggle('top-align', state.log.length > 0 || state.search.trim() !== '');
  if(state.loading){
    c.innerHTML = `<div class="empty"><span class="spinner" style="border-color:rgba(0,0,0,0.12); border-top-color:var(--brand);"></span><br><br>Carregando produtos...</div>`;
    return;
  }

  let produtoBlock = '';
  if(state.selectedProduct){
    produtoBlock = `
      <div class="selected-product">
        <div>
          <div class="name">${escapeHtml(state.selectedProduct.descricao)}</div>
          <div class="sku">${escapeHtml(state.selectedProduct.sku)}</div>
        </div>
        <button type="button" class="clear-sel" id="clear-produto">✕</button>
      </div>
    `;
  } else {
    const filtered = state.search.trim() === '' ? [] : searchProducts(state.search, state.products);
    produtoBlock = `
      <input type="text" id="search-input" placeholder="Código (SKU) ou nome do produto" value="${escapeHtml(state.search)}" autocomplete="off">
      ${ state.search.trim() === '' ? '' : `
      <div class="search-results">
        ${ filtered.length === 0 ? `<div class="empty">Nenhum produto encontrado.</div>`
          : filtered.map(p => `
              <div class="prod-item" data-sku="${escapeHtml(p.sku)}">
                <span class="prod-sku">${escapeHtml(p.sku)}</span>
                <span class="prod-desc">${escapeHtml(p.descricao)}</span>
              </div>
            `).join('')
        }
      </div>` }
    `;
  }

  let logBlock = '';
  if(state.log.length > 0){
    logBlock = `
      <div class="log">
        <h3>Lançamentos</h3>
        ${state.log.slice().reverse().map(l => `
          <div class="log-item">
            <div class="top">
              <span class="desc">${escapeHtml(l.descricao)}</span>
              <span class="qty">${l.quantidade} kg</span>
            </div>
            <div class="meta">SKU ${escapeHtml(l.sku)}</div>
          </div>
        `).join('')}
        <button type="button" class="btn-secondary btn-block" id="finalizar-btn" style="margin-top:12px;">Finalizar e baixar planilha</button>
      </div>
    `;
  }

  c.innerHTML = `
    <div class="panel">
      <div class="f-group">
        <div class="f-label">Produto</div>
        ${produtoBlock}
      </div>

      <div class="f-group">
        <div class="f-label">Quantidade</div>
        <div class="qty-readout">
          <input type="number" inputmode="decimal" step="any" min="0" id="qty-input" placeholder="0.0" value="${escapeHtml(state.qty)}">
          <div class="unit">kg</div>
        </div>
      </div>
    </div>

    <button class="btn-primary btn-block" id="lancar-btn" ${state.busy ? 'disabled' : ''}>
      ${state.busy ? '<span class="spinner"></span>' : 'Lançar'}
    </button>
    ${logBlock}
  `;
  attachEvents();
}

function attachEvents(){
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      render();
      const el = document.getElementById('search-input');
      if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    });
    document.querySelectorAll('.prod-item').forEach(item => {
      item.addEventListener('click', () => {
        const sku = item.dataset.sku;
        state.selectedProduct = state.products.find(p => p.sku === sku);
        render();
        setTimeout(() => { const q = document.getElementById('qty-input'); if(q) q.focus(); }, 0);
      });
    });
  }
  const clearProduto = document.getElementById('clear-produto');
  if(clearProduto) clearProduto.addEventListener('click', () => { state.selectedProduct = null; state.search = ''; render(); });

  const qtyInput = document.getElementById('qty-input');
  if(qtyInput){
    qtyInput.addEventListener('input', (e) => { state.qty = e.target.value; });
    qtyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLancar(); });
  }

  const lancarBtn = document.getElementById('lancar-btn');
  if(lancarBtn) lancarBtn.addEventListener('click', doLancar);

  const finalizarBtn = document.getElementById('finalizar-btn');
  if(finalizarBtn) finalizarBtn.addEventListener('click', finalizarEBaixarPlanilha);
}

async function doLancar(){
  if(!state.selectedProduct){ showToast('Selecione um produto.', true); return; }
  const qtyVal = parseFloat(state.qty);
  if(!qtyVal || qtyVal <= 0){ showToast('Informe uma quantidade válida.', true); return; }

  state.busy = true; render();
  try{
    const payload = {
      sku: state.selectedProduct.sku,
      descricao: state.selectedProduct.descricao,
      quantidade: qtyVal
    };
    await lancarPosicao(payload);
    state.log.push(payload);
    showToast('Lançado: ' + qtyVal + ' kg — ' + state.selectedProduct.descricao);
    state.selectedProduct = null;
    state.search = '';
    state.qty = '';
  } catch(err){
    showToast('Erro ao lançar: ' + err.message, true);
  }
  state.busy = false;
  render();
  setTimeout(() => { const s = document.getElementById('search-input'); if(s) s.focus(); }, 0);
}

(async function init(){
  try{
    const data = await getProducts();
    state.products = data.products;
  } catch(err){
    showToast('Erro ao carregar produtos: ' + err.message, true);
  }
  state.loading = false;
  render();
})();
</script>
</body>
</html>
