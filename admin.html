<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregar Produtos - Admin</title>
<style>
  :root{ --concrete:#d8d5cd; --ink:#1f2320; --safety:#f2b300; --safety-deep:#c98e00; --ok:#2f6f4e; --danger:#a83232; --line:#a7a297; --panel:#eeece6; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--concrete); color:var(--ink); font-family:'Segoe UI',Roboto,-apple-system,sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:28px 16px 60px; }
  .tag{ display:inline-flex; background:var(--ink); color:var(--safety); font-family:'Courier New',monospace; font-weight:700; padding:6px 12px; font-size:0.78rem; }
  h1{ font-size:1.5rem; margin:14px 0 6px; }
  .sub{ color:#4a4f4a; font-size:0.92rem; margin-bottom:20px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:20px; }
  .count{ font-family:'Courier New',monospace; font-weight:700; font-size:1.1rem; margin-bottom:16px; }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius:3px; font-weight:700; font-size:0.95rem; padding:12px 18px; width:100%; background:var(--ink); color:var(--safety); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .status{ margin-top:16px; font-size:0.9rem; padding:12px; border-radius:3px; display:none; }
  .status.ok{ display:block; background:#e4efe8; color:var(--ok); border:1px solid var(--ok); }
  .status.err{ display:block; background:#f6e4e4; color:var(--danger); border:1px solid var(--danger); }
  .spinner{ width:16px; height:16px; border:2px solid rgba(0,0,0,0.15); border-top-color:var(--ink); border-radius:50%; display:inline-block; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a.back{ display:inline-block; margin-top:20px; color:var(--ink); font-size:0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">CONTAGEM DE ESTOQUE — ADMIN</span>
  <h1>Carregar produtos na planilha</h1>
  <div class="sub">Isso lê data/produtos.json e grava (sobrescrevendo) as colunas A e B da aba Inventario. As colunas de contagem (C em diante) não são afetadas.</div>
  <div class="panel">
    <div class="count" id="count">carregando lista de data/produtos.json...</div>
    <button id="btn" disabled>Carregar produtos</button>
    <div class="status" id="status"></div>
  </div>
  <a class="back" href="index.html">&larr; Voltar para a contagem</a>
</div>
<script src="config.js"></script>
<script>
let PRODUCTS = [];

async function init() {
  try {
    const res = await fetch('data/produtos.json');
    PRODUCTS = await res.json();
    document.getElementById('count').textContent = PRODUCTS.length + ' produtos prontos para carregar';
    const btn = document.getElementById('btn');
    btn.disabled = false;
    btn.textContent = 'Carregar ' + PRODUCTS.length + ' produtos';
  } catch (err) {
    document.getElementById('count').textContent = 'Erro ao ler data/produtos.json: ' + err.message;
  }
}

document.getElementById('btn').addEventListener('click', async () => {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Carregando...';
  const statusEl = document.getElementById('status');
  statusEl.className = 'status';
  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'loadProducts', products: PRODUCTS })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    statusEl.className = 'status ok';
    statusEl.textContent = 'Pronto! ' + data.count + ' produtos gravados na aba Inventario.';
    btn.textContent = 'Carregado com sucesso';
  } catch (err) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Erro: ' + err.message;
    btn.disabled = false;
    btn.textContent = 'Tentar novamente';
  }
});

init();
</script>
</body>
</html>
