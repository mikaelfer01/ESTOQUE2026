<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados da Contagem</title>
<style>
  :root{
    --concrete: #d8d5cd;
    --ink: #1f2320;
    --ink-soft: #4a4f4a;
    --panel: #eeece6;
    --safety: #f2b300;
    --safety-deep: #c98e00;
    --ok: #2f6f4e;
    --danger: #a83232;
    --line: #a7a297;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--concrete); color: var(--ink);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width: 1100px; margin: 0 auto; padding: 16px 12px 80px; }
  .topbar{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 14px; }
  .tag{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink); color:var(--safety);
    font-family: 'Courier New', monospace; font-weight:700; letter-spacing:0.5px;
    padding:6px 12px; font-size:0.78rem;
  }
  h1{ font-size:1.4rem; margin: 14px 0 2px; font-weight:800; }
  .sub{ color:var(--ink-soft); font-size:0.88rem; margin-bottom:18px; }
  a.back{ font-size:0.8rem; color:var(--ink-soft); text-decoration:none; white-space:nowrap; }

  .filters{
    background: var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:14px; margin-bottom:16px;
    display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px;
  }
  .field label{ display:block; font-size:0.75rem; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:10px; border:1px solid var(--line);
    border-radius:3px; font-size:1rem; background:#fff; color:var(--ink);
  }
  .filters .actions{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; grid-column: 1 / -1; }
  .filters .actions button{ flex:1; min-width:120px; }

  button{
    font-family: inherit; cursor:pointer; border:none;
    border-radius:3px; font-weight:700; font-size:0.85rem;
    padding: 11px 14px; min-height:40px;
  }
  .btn-primary{ background: var(--ink); color: var(--safety); }
  .btn-secondary{ background:#fff; color:var(--ink); border:1px solid var(--line); }

  .summary{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:10px;
    margin-bottom:18px;
  }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:4px; padding:12px 14px; }
  .stat .num{ font-size:1.4rem; font-weight:800; font-family:'Courier New', monospace; }
  .stat .lbl{ font-size:0.75rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; }

  .table-wrap{ background:#fff; border:1px solid var(--line); border-radius:4px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:0.85rem; min-width:720px; }
  thead th{
    text-align:left; padding:10px 12px; background:var(--ink); color:var(--safety);
    font-size:0.72rem; text-transform:uppercase; letter-spacing:0.03em; position:sticky; top:0;
  }
  tbody td{ padding:9px 12px; border-bottom:1px solid #eee; }
  tbody tr:hover{ background: var(--concrete); }
  .mono{ font-family:'Courier New', monospace; }
  .status-badge{
    display:inline-block; padding:2px 8px; border-radius:3px; font-size:0.72rem; font-weight:700;
  }
  .status-aberta{ background:#fff4d6; color:var(--safety-deep); }
  .status-finalizada{ background:#e4efe8; color:var(--ok); }

  .empty{ text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:0.9rem; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(0,0,0,0.15);
    border-top-color:var(--ink); border-radius:50%; display:inline-block;
    animation: spin 0.7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Abaixo de 640px a tabela vira uma lista de cards — mais fácil de ler
     e navegar num celular do que rolar uma tabela larga na horizontal. */
  @media (max-width: 640px){
    .summary{ grid-template-columns: repeat(2, 1fr); }
    .table-wrap{ overflow-x:visible; border:none; background:none; }
    table, thead, tbody, tr, td{ display:block; width:100%; }
    thead{ display:none; }
    tbody tr{
      background:#fff; border:1px solid var(--line); border-radius:4px;
      margin-bottom:10px; padding:10px 12px;
    }
    tbody tr td{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:6px 0; border-bottom:1px dashed #eee; text-align:right;
    }
    tbody tr td:last-child{ border-bottom:none; }
    tbody tr td::before{
      content: attr(data-label);
      font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase;
      letter-spacing:0.03em; font-weight:700; text-align:left; flex-shrink:0;
    }
    tbody tr:hover{ background:#fff; }
    td.empty-cell{ display:block !important; padding:0; }
    td.empty-cell::before{ content:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="tag">CONTAGEM DE ESTOQUE — RESULTADOS</span>
    <a class="back" href="index.html">&larr; Voltar para a contagem</a>
  </div>
  <h1>Resultados das contagens</h1>
  <div class="sub">Filtre por período, sessão, status ou produto para visualizar os lançamentos.</div>

  <div class="filters">
    <div class="field">
      <label>De (data início)</label>
      <input type="date" id="f-from">
    </div>
    <div class="field">
      <label>Até (data início)</label>
      <input type="date" id="f-to">
    </div>
    <div class="field">
      <label>Sessão</label>
      <select id="f-session"><option value="">Todas</option></select>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="">Todos</option>
        <option value="aberta">Aberta</option>
        <option value="finalizada">Finalizada</option>
      </select>
    </div>
    <div class="field">
      <label>Buscar (SKU ou descrição)</label>
      <input type="text" id="f-q" placeholder="Ex: 4521 ou parafuso">
    </div>
    <div class="actions">
      <button class="btn-primary" id="btn-filter">Filtrar</button>
      <button class="btn-secondary" id="btn-clear">Limpar</button>
      <button class="btn-secondary" id="btn-csv">Exportar CSV</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Sessão</th>
          <th>Status</th>
          <th>Início</th>
          <th>SKU</th>
          <th>Descrição</th>
          <th>Quantidade (kg)</th>
          <th>Atualizado em</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td class="empty-cell" colspan="7"><div class="empty"><span class="spinner"></span> Carregando...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let lastResults = [];

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  }).format(d);
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildQuery(){
  const params = new URLSearchParams();
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const sessionId = document.getElementById('f-session').value;
  const status = document.getElementById('f-status').value;
  const q = document.getElementById('f-q').value.trim();
  if(from) params.set('from', from + 'T00:00:00');
  if(to) params.set('to', to + 'T23:59:59');
  if(sessionId) params.set('sessionId', sessionId);
  if(status) params.set('status', status);
  if(q) params.set('q', q);
  return params.toString();
}

function renderSummary(rows){
  const totalQtd = rows.reduce((acc, r) => acc + Number(r.quantidade || 0), 0);
  const sessoes = new Set(rows.map(r => r.session_id));
  const skus = new Set(rows.map(r => r.sku));
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="num">${rows.length}</div><div class="lbl">Lançamentos</div></div>
    <div class="stat"><div class="num">${totalQtd.toLocaleString('pt-BR', {maximumFractionDigits:2})}</div><div class="lbl">Total (kg)</div></div>
    <div class="stat"><div class="num">${sessoes.size}</div><div class="lbl">Sessões</div></div>
    <div class="stat"><div class="num">${skus.size}</div><div class="lbl">Produtos distintos</div></div>
  `;
}

function renderTable(rows){
  const tbody = document.getElementById('tbody');
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td class="empty-cell" colspan="7"><div class="empty">Nenhum lançamento encontrado para esse filtro.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="mono" data-label="Sessão">${escapeHtml(r.session_label)}</td>
      <td data-label="Status"><span class="status-badge status-${r.session_status}">${r.session_status === 'aberta' ? 'aberta' : 'finalizada'}</span></td>
      <td data-label="Início">${fmtDate(r.inicio)}</td>
      <td class="mono" data-label="SKU">${escapeHtml(r.sku)}</td>
      <td data-label="Descrição">${escapeHtml(r.descricao)}</td>
      <td class="mono" data-label="Quantidade (kg)">${Number(r.quantidade).toLocaleString('pt-BR', {maximumFractionDigits:2})}</td>
      <td data-label="Atualizado em">${fmtDate(r.atualizado_em)}</td>
    </tr>
  `).join('');
}

function populateSessionFilter(sessions){
  const sel = document.getElementById('f-session');
  const current = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' + sessions.map(s =>
    `<option value="${escapeHtml(s.id)}">${escapeHtml(s.label)} (${s.status})</option>`
  ).join('');
  sel.value = current;
}

async function load(){
  document.getElementById('tbody').innerHTML = `<tr><td class="empty-cell" colspan="7"><div class="empty"><span class="spinner"></span> Carregando...</div></td></tr>`;
  try{
    const qs = buildQuery();
    const res = await fetch('/api/results' + (qs ? '?' + qs : ''));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    lastResults = data.results;
    populateSessionFilter(data.sessions);
    renderSummary(data.results);
    renderTable(data.results);
  } catch(err){
    document.getElementById('tbody').innerHTML = `<tr><td class="empty-cell" colspan="7"><div class="empty">Erro ao carregar: ${escapeHtml(err.message)}</div></td></tr>`;
  }
}

function exportCsv(){
  if(lastResults.length === 0) return;
  const header = ['Sessao','Status','Inicio','SKU','Descricao','Quantidade_kg','Atualizado_em'];
  const lines = [header.join(';')];
  lastResults.forEach(r => {
    lines.push([
      r.session_label, r.session_status, fmtDate(r.inicio), r.sku,
      (r.descricao || '').replace(/;/g, ','), String(r.quantidade).replace('.', ','), fmtDate(r.atualizado_em)
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(';'));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'resultados-contagem.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btn-filter').addEventListener('click', load);
document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  document.getElementById('f-session').value = '';
  document.getElementById('f-status').value = '';
  document.getElementById('f-q').value = '';
  load();
});
document.getElementById('btn-csv').addEventListener('click', exportCsv);
document.getElementById('f-q').addEventListener('keydown', (e) => { if(e.key === 'Enter') load(); });

load();
</script>
</body>
</html>
